name: Playwright Tests

on:
  push:
    branches: [develop, test, stage, prod]
  pull_request:
    branches: [develop, test, stage, prod]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site/testing

    env:
      ENV: ${{ secrets.ENV || 'testing' }}
      MACHINE: ${{ secrets.MACHINE || 'github' }}
      PORT: ${{ secrets.PORT || '8000' }}
      APP_NAME: ${{ secrets.APP_NAME || 'POC02-ExpressSetup' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost:5173' }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:8000' }}
      MONGODB_URL: ${{ secrets.MONGODB_URL || 'mongodb://localhost:27017/poc02' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show configuration
        run: |
          echo "ENV=$ENV"
          echo "MACHINE=$MACHINE"
          echo "PORT=$PORT"
          echo "APP_NAME=$APP_NAME"
          echo "FRONTEND_URL=$FRONTEND_URL"
          echo "BACKEND_URL=$BACKEND_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: site/testing/playwright-report/
          retention-days: 30